<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent — Conductor Task Mgmt Prototype</title>

  <style>
    /* Maestro design tokens MUST be defined before Tailwind CDN loads */
    :root {
      --maestro-bg: 24 24 27;
      --maestro-card: 38 38 42;
      --maestro-surface: 32 32 36;
      --maestro-surface-raised: 40 40 45;
      --maestro-border: 50 50 56;
      --maestro-border-hover: 70 70 78;
      --maestro-text-primary: 240 238 235;
      --maestro-text-secondary: 180 175 168;
      --maestro-text-tertiary: 140 135 128;
      --maestro-accent: 255 110 70;
      --maestro-accent-hover: 255 130 95;
      --maestro-accent-light: 50 30 25;
      --maestro-on-accent: 255 255 255;
      --maestro-success: 60 180 100;
      --maestro-success-light: 25 45 35;
      --maestro-danger: 230 90 70;
      --maestro-danger-light: 50 30 25;
      --maestro-warning: 210 160 60;
      --maestro-warning-light: 50 40 25;
      --maestro-amber: 251 191 36;
      --maestro-amber-soft: 50 38 18;
      --maestro-info: 80 160 220;
      --maestro-info-light: 25 35 45;
      --maestro-chip-green: 60 180 100;
      --maestro-chip-green-soft: 25 45 35;
      --maestro-chip-orange: 255 140 80;
      --maestro-chip-orange-soft: 50 35 25;
      --maestro-chip-blue: 80 160 220;
      --maestro-chip-blue-soft: 25 35 45;
      --maestro-chip-teal: 70 190 180;
      --maestro-chip-teal-soft: 25 45 45;
      --maestro-chip-purple: 160 120 230;
      --maestro-chip-purple-soft: 40 35 55;
      --maestro-chip-pink: 240 120 180;
      --maestro-chip-pink-soft: 50 30 45;
      --maestro-control-knob: 255 255 255;
      --maestro-overlay: 0 0 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgb(var(--maestro-bg)); }
    ::-webkit-scrollbar-thumb { background: rgb(var(--maestro-border)); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--maestro-border-hover)); }
    body { background: rgb(var(--maestro-bg)); }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mbg: 'rgb(var(--maestro-bg))',
            mcard: 'rgb(var(--maestro-card))',
            msurface: 'rgb(var(--maestro-surface))',
            mraised: 'rgb(var(--maestro-surface-raised))',
            mborder: 'rgb(var(--maestro-border))',
            mborderh: 'rgb(var(--maestro-border-hover))',
            mtext: 'rgb(var(--maestro-text-primary))',
            mtext2: 'rgb(var(--maestro-text-secondary))',
            mtext3: 'rgb(var(--maestro-text-tertiary))',
            maccent: 'rgb(var(--maestro-accent))',
            maccenth: 'rgb(var(--maestro-accent-hover))',
            maccentl: 'rgb(var(--maestro-accent-light))',
            msuccess: 'rgb(var(--maestro-success))',
            msuccessl: 'rgb(var(--maestro-success-light))',
            mdanger: 'rgb(var(--maestro-danger))',
            mdangerl: 'rgb(var(--maestro-danger-light))',
            mwarning: 'rgb(var(--maestro-warning))',
            mwarningl: 'rgb(var(--maestro-warning-light))',
            mamber: 'rgb(var(--maestro-amber))',
            mambersoft: 'rgb(var(--maestro-amber-soft))',
            minfo: 'rgb(var(--maestro-info))',
            minfol: 'rgb(var(--maestro-info-light))',
            'chip-green': 'rgb(var(--maestro-chip-green))',
            'chip-green-soft': 'rgb(var(--maestro-chip-green-soft))',
            'chip-orange': 'rgb(var(--maestro-chip-orange))',
            'chip-orange-soft': 'rgb(var(--maestro-chip-orange-soft))',
            'chip-blue': 'rgb(var(--maestro-chip-blue))',
            'chip-blue-soft': 'rgb(var(--maestro-chip-blue-soft))',
            'chip-teal': 'rgb(var(--maestro-chip-teal))',
            'chip-teal-soft': 'rgb(var(--maestro-chip-teal-soft))',
            'chip-purple': 'rgb(var(--maestro-chip-purple))',
            'chip-purple-soft': 'rgb(var(--maestro-chip-purple-soft))',
            'chip-pink': 'rgb(var(--maestro-chip-pink))',

          fontFamily: {
            sans: ['Commissioner', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['DM Serif Display', 'ui-serif', 'Georgia', 'serif'],

          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="../theme.js"></script>
  <script src="task-data.js"></script>
  <script src="agent-data.js"></script>
  <script>window.CURRENT_APP_TAB = 'agent';</script>
  <script src="topnav.js"></script>

  <script src="agent-context-panel.js"></script>

  <style>
    .top-tab {
      padding: 0.625rem 0.875rem; font-size: 0.8125rem; color: rgb(var(--maestro-text-secondary));
      cursor: pointer; transition: color .12s; border-bottom: 2px solid transparent;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .top-tab:hover { color: rgb(var(--maestro-text-primary)); }
    .top-tab.active { color: rgb(var(--maestro-text-primary)); border-bottom-color: rgb(var(--maestro-accent)); }

    /* left rail */
    .proj-row { display: block; width: 100%; text-align: left; padding: 8px 16px; border-left: 2px solid transparent; cursor: pointer; }
    .proj-row:hover { background: color-mix(in srgb, rgb(var(--maestro-surface)) 60%, transparent); }
    .proj-row.active { background: color-mix(in srgb, rgb(var(--maestro-surface-raised)) 70%, transparent); border-left-color: rgb(var(--maestro-accent)); }
    .thread-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 16px; border-left: 2px solid transparent; cursor: pointer; }
    .thread-row:hover { background: color-mix(in srgb, rgb(var(--maestro-surface)) 50%, transparent); }
    .thread-row.active { background: color-mix(in srgb, rgb(var(--maestro-accent-light)) 40%, transparent); border-left-color: rgb(var(--maestro-accent)); }

    /* messages */
    .a-sys { display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgb(var(--maestro-text-tertiary)); padding: 6px 0; }
    .a-sys a { color: rgb(var(--maestro-accent)); text-decoration: underline; text-underline-offset: 2px; }
    .a-msg { display: flex; gap: 10px; margin-bottom: 16px; }
    .a-av { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
    .a-av.advisor { background: rgb(var(--maestro-surface)); color: rgb(var(--maestro-text-primary)); }
    .a-av.ai { background: rgb(var(--maestro-accent)); color: rgb(var(--maestro-on-accent)); }
    .a-name { font-size: 11px; font-weight: 600; color: rgb(var(--maestro-text-secondary)); margin-bottom: 3px; }
    .a-bubble { background: rgb(var(--maestro-card)); border: 1px solid rgb(var(--maestro-border)); border-radius: 10px; padding: 9px 13px; font-size: 13px; color: rgb(var(--maestro-text-primary)); line-height: 1.55; }
    .a-msg.advisor .a-bubble { background: rgb(var(--maestro-bg)); }

    .a-rec { background: rgb(var(--maestro-bg)); border: 1px solid rgb(var(--maestro-border)); border-radius: 10px; padding: 13px; }
    .a-rec.added { border-color: rgb(var(--maestro-accent)); box-shadow: 0 0 0 3px color-mix(in srgb, rgb(var(--maestro-accent-light)) 60%, transparent); }

    .src-chip { display: inline-flex; align-items: center; gap: 5px; font-family: ui-monospace, monospace; font-size: 10px; color: rgb(var(--maestro-chip-green)); background: rgb(var(--maestro-chip-green-soft)); border: 1px solid color-mix(in srgb, rgb(var(--maestro-chip-green)) 40%, transparent); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
    .hf-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; border-radius: 6px; padding: 3px 9px; border: 1px solid; cursor: pointer; }
    .hf-chip .d { width: 6px; height: 6px; border-radius: 50%; }
    .hf-pass { color: rgb(var(--maestro-chip-green)); background: rgb(var(--maestro-chip-green-soft)); border-color: color-mix(in srgb, rgb(var(--maestro-chip-green)) 40%, transparent); }
    .hf-pass .d { background: rgb(var(--maestro-chip-green)); }
    .hf-factual { color: rgb(var(--maestro-amber)); background: rgb(var(--maestro-amber-soft)); border-color: color-mix(in srgb, rgb(var(--maestro-amber)) 40%, transparent); }
    .hf-factual .d { background: rgb(var(--maestro-amber)); }
    .hf-intent { color: rgb(var(--maestro-chip-blue)); background: rgb(var(--maestro-chip-blue-soft)); border-color: color-mix(in srgb, rgb(var(--maestro-chip-blue)) 40%, transparent); }
    .hf-intent .d { background: rgb(var(--maestro-chip-blue)); }

    .a-event { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; border-radius: 7px; padding: 6px 10px; }
    .a-event.task { color: rgb(var(--maestro-chip-purple)); background: rgb(var(--maestro-chip-purple-soft)); border: 1px solid color-mix(in srgb, rgb(var(--maestro-chip-purple)) 35%, transparent); }
    .a-event.trip { color: rgb(var(--maestro-chip-green)); background: rgb(var(--maestro-chip-green-soft)); border: 1px solid color-mix(in srgb, rgb(var(--maestro-chip-green)) 35%, transparent); }
    .a-event a { cursor: pointer; }

    .panel-h { font-size: 12px; font-weight: 600; color: rgb(var(--maestro-text-primary)); }
    .panel-eyebrow { font-size: 10px; font-family: ui-monospace, monospace; text-transform: uppercase; letter-spacing: 1px; color: rgb(var(--maestro-accent)); }
  </style>
</head>

<body class="text-mtext2 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <div id="topnav-root"></div>

  <!-- Helper strip -->
  <div class="bg-mambersoft border-b border-mamber/30 px-4 py-1.5 text-[11px] text-mtext3 flex items-center gap-2 flex-shrink-0">
    <svg class="w-3 h-3 text-mamber" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span>Agent tab · prototype mock · simulated data ·
      <a href="https://www.notion.so/PRD-Conductor-Agent-Mode-V1-35ed1ecb218981bdbf77f0cf027059a8" target="_blank" class="text-maccent hover:text-maccenth underline">Agent Mode PRD</a> ·
      <a href="../agent-overview.html" class="text-maccent hover:text-maccenth underline">Agent Mode outline</a> ·
      <a href="index.html" class="text-maccent hover:text-maccenth underline">prototype index</a></span>
  </div>

  <!-- 2-column app — left switcher + center (Project Home or Thread).
       Trip Context / Memory / Tasks live in the slide-in context panel. -->
  <main class="flex-1 flex min-h-0">

    <!-- LEFT — Projects switcher -->
    <aside class="w-[300px] bg-mcard border-r border-mborder flex flex-col flex-shrink-0">
      <div class="px-4 py-3 border-b border-mborder flex items-center justify-between">
        <span class="panel-h">Agent</span>
        <span class="text-[10px] text-mtext3 font-mono">/agent</span>
      </div>
      <div id="project-list" class="flex-1 overflow-y-auto py-1"></div>
      <div class="px-4 py-2.5 border-t border-mborder text-[10px] text-mtext3">
        Projects group threads by trip &amp; client · PRD §4
      </div>
    </aside>

    <!-- CENTER — Project Home or Thread (rendered by renderCenter) -->
    <section id="center" class="flex-1 flex flex-col min-w-0"></section>

  </main>

  <script>
    /* ---------- state ---------- */
    let curProject = 'p-khan';
    let curThread  = null;          // null → Project Home; a thread id → Thread view
    const esc = (s) => Theme.escapeHtml(s == null ? '' : String(s));

    /* ---------- routing — #project=X → Home, #project=X&thread=Y → Thread ---------- */
    function parseHash() {
      const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      const t = h.get('thread'), p = h.get('project');
      if (t && AgentData.thread(t)) { curThread = t; curProject = AgentData.thread(t).project; return; }
      if (p && AgentData.project(p)) { curProject = p; curThread = null; return; }
      curProject = 'p-khan'; curThread = null;
    }
    function syncHash() {
      history.replaceState(null, '', '#project=' + curProject + (curThread ? '&thread=' + curThread : ''));
    }

    /* ---------- navigation ---------- */
    function selectProject(pid) { curProject = pid; curThread = null; syncHash(); renderAll(); }
    function openThread(tid) {
      const t = AgentData.thread(tid); if (!t) return;
      curThread = tid; curProject = t.project; syncHash(); renderAll();
    }
    function backToHome() { curThread = null; syncHash(); renderAll(); }

    // New thread — the PRD entry point. ⌘K and the Project Home starter both land here.
    function startNewThread(initialAsk) {
      if (window.closeContextPanel) window.closeContextPanel();
      const th = AgentData.createThread(curProject);
      curThread = th.id; syncHash();
      const ask = (initialAsk || '').trim();
      if (ask) { sendToThread(th.id, ask); }
      else { renderAll(); const ci = document.getElementById('composer-input'); if (ci) ci.focus(); }
    }

    // Composer echo — appends the advisor message; the agent's grounded reply is mocked.
    function sendToThread(tid, text) {
      const th = AgentData.thread(tid); if (!th) return;
      const isFirst = !AgentData.messages(tid).some(m => m.role === 'advisor');
      AgentData.appendMessage(tid, { role: 'advisor', kind: 'text', body: esc(text) });
      if (isFirst) {
        th.title = text.length > 60 ? text.slice(0, 59) + '…' : text;
        AgentData.appendMessage(tid, { role: 'system', kind: 'context',
          body: 'Prototype — the agent\'s grounded reply is mocked here. Open the '
              + '<a href="#project=p-khan&thread=th-aman">find a suite at Aman</a> thread '
              + 'for the fully-worked example.' });
      }
      renderAll();
      scrollMessagesToBottom();
    }

    /* ---------- left rail — workspace switcher ---------- */
    function renderProjectList() {
      let html = '';
      const recent = AgentData.recentThreads(4);
      if (recent.length) {
        html += `<div class="px-4 pt-3 pb-1 text-[10px] font-mono uppercase tracking-wider text-mtext3">Recent</div>`;
        recent.forEach(t => {
          const active = t.id === curThread;
          const dot = t.status === 'open' ? 'rgb(var(--maestro-chip-green))' : t.status === 'paused' ? 'rgb(var(--maestro-amber))' : 'rgb(var(--maestro-text-tertiary))';
          const pr = AgentData.project(t.project);
          html += `<button class="thread-row ${active ? 'active' : ''}" onclick="openThread('${t.id}')">
            <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background:${dot}"></span>
            <span class="flex-1 min-w-0">
              <span class="block truncate text-[12px] ${active ? 'text-mtext' : 'text-mtext2'}">${esc(t.title)}</span>
              <span class="block truncate text-[10px] text-mtext3">${esc(pr ? pr.name : '')}</span>
            </span>
          </button>`;
        });
      }
      [['Trips', 'trip'], ['Clients', 'client']].forEach(([label, kind]) => {
        const projs = AGENT_PROJECTS.filter(p => p.kind === kind);
        if (!projs.length) return;
        html += `<div class="px-4 pt-3 pb-1 text-[10px] font-mono uppercase tracking-wider text-mtext3">${label}</div>`;
        projs.forEach(p => {
          const active = p.id === curProject;
          const tc = AgentData.threadsFor(p.id).length;
          html += `<button class="proj-row ${active ? 'active' : ''}" onclick="selectProject('${p.id}')">
            <div class="flex items-center gap-2">
              <div class="flex-1 min-w-0">
                <div class="text-sm ${active ? 'text-mtext' : 'text-mtext2'} font-medium truncate">${esc(p.name)}</div>
                <div class="text-[11px] text-mtext3 truncate">${esc(p.meta)}</div>
              </div>
              <span class="text-[10px] font-mono text-mtext3 flex-shrink-0">${tc}</span>
            </div>
          </button>`;
        });
      });
      document.getElementById('project-list').innerHTML = html;
    }

    /* ---------- center — Project Home or Thread ---------- */
    function renderCenter() {
      if (curThread && AgentData.thread(curThread)) renderThread();
      else renderProjectHome();
    }

    function threadPreview(tid) {
      const msgs = AgentData.messages(tid);
      for (let i = msgs.length - 1; i >= 0; i--) {
        const m = msgs[i];
        if (m.kind === 'text' || m.kind === 'recs' || m.kind === 'actions' || m.kind === 'draft') {
          const txt = String(m.body || '').replace(/<[^>]+>/g, '').trim();
          if (txt) return txt.length > 92 ? txt.slice(0, 91) + '…' : txt;
        }
      }
      return 'Context loaded — no messages yet.';
    }

    /* ---------- center — Project Home (workspace landing) ---------- */
    function renderProjectHome() {
      const p = AgentData.project(curProject);
      const center = document.getElementById('center');
      if (!p) { center.innerHTML = ''; return; }
      const threads = AgentData.threadsFor(curProject);
      const ctx = AgentData.context(curProject);
      const mem = AgentData.memory(curProject);
      const ins = AgentData.insights(curProject);
      const tasks = AgentData.tasksFor(curProject);
      const kindLabel = p.kind === 'trip' ? 'Trip' : 'Client';
      const ctxCount = ctx ? (ctx.trip.length + ctx.org.length) : 0;

      const card = (view, label, count, sub) => `
        <button onclick="openContextPanel('${view}','${curProject}')" class="bg-mcard border border-mborder rounded-lg p-3 text-left hover:border-maccent/50 transition-colors">
          <div class="text-[10px] font-mono uppercase tracking-wider text-mtext3">${label}</div>
          <div class="text-lg font-semibold text-mtext mt-0.5">${count}</div>
          <div class="text-[11px] text-mtext3">${sub}</div>
        </button>`;

      const threadRow = (t) => {
        const dot = t.status === 'open' ? 'rgb(var(--maestro-chip-green))' : t.status === 'paused' ? 'rgb(var(--maestro-amber))' : 'rgb(var(--maestro-text-tertiary))';
        return `<button onclick="openThread('${t.id}')" class="w-full text-left bg-mcard border border-mborder rounded-lg p-3 hover:border-mborderh transition-colors flex items-start gap-3">
          <span class="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style="background:${dot}"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-mtext truncate">${esc(t.title)}</span>
              ${t.isNew ? '<span class="text-[9px] font-mono text-maccent bg-maccentl rounded px-1.5 py-0.5 flex-shrink-0">NEW</span>' : ''}
            </div>
            <div class="text-[11px] text-mtext3 truncate mt-0.5">${esc(threadPreview(t.id))}</div>
          </div>
          <div class="text-right flex-shrink-0">
            <span class="text-[9px] font-mono uppercase tracking-wide text-chip-blue bg-chip-blue-soft rounded px-1.5 py-0.5">${esc(t.skill)}</span>
            <div class="text-[10px] text-mtext3 mt-1 capitalize">${esc(t.status)} · ${esc(t.updated)}</div>
          </div>
        </button>`;
      };

      center.innerHTML = `
        <div class="flex-1 overflow-y-auto">
          <div class="max-w-[800px] mx-auto px-8 py-8">

            <div class="flex items-center gap-2.5 mb-1">
              <h1 class="text-xl font-serif font-semibold text-mtext">${esc(p.name)}</h1>
              <span class="text-[10px] font-mono uppercase tracking-wider text-mtext3 bg-msurface rounded px-1.5 py-0.5">${kindLabel}</span>
            </div>
            <div class="text-sm text-mtext3 mb-5">${esc(p.meta)} · the agent workspace for this ${esc(p.kind)}</div>

            <div class="grid grid-cols-3 gap-2 mb-6">
              ${card('overview', 'Trip Context', ctxCount, 'grounding facts')}
              ${card('memory', 'Memory', mem.length, ins.length ? ins.length + ' suggested' : 'project-scoped')}
              ${card('tasks', 'Tasks', tasks.length, 'agent-created')}
            </div>

            <div class="bg-mcard border border-mborder rounded-xl p-3 mb-6">
              <div class="text-[11px] text-mtext3 mb-2">Start a thread — opens a hotel-search with this ${esc(p.kind)}'s context pre-loaded.</div>
              <div class="flex items-center gap-2 bg-mbg border border-mborder rounded-lg px-3 py-2">
                <svg class="w-4 h-4 text-maccent flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                <input id="home-starter" type="text" placeholder="Ask the agent to find a hotel for this trip…" class="flex-1 bg-transparent text-sm text-mtext2 placeholder-mtext3 outline-none">
                <span class="text-[10px] font-mono text-mtext3 border border-mborder rounded px-1.5 py-0.5">⌘K</span>
                <button id="home-starter-btn" class="px-3 py-1.5 rounded-md bg-maccent text-xs text-white font-medium hover:bg-maccenth">New thread</button>
              </div>
            </div>

            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-semibold text-mtext">Threads</span>
              <span class="text-[11px] text-mtext3 font-mono">${threads.length}</span>
            </div>
            <div class="space-y-2">
              ${threads.length ? threads.map(threadRow).join('')
                : '<div class="text-xs text-mtext3 py-6 text-center border border-dashed border-mborder rounded-lg">No threads yet — start one above.</div>'}
            </div>

          </div>
        </div>`;

      const si = document.getElementById('home-starter');
      const sb = document.getElementById('home-starter-btn');
      if (sb) sb.addEventListener('click', () => startNewThread(si ? si.value : ''));
      if (si) si.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startNewThread(si.value); } });
    }

    /* ---------- center — Thread ---------- */
    function threadHeaderHtml(th, proj) {
      return `
        <div class="flex-shrink-0">
          <div class="flex items-center gap-2.5 px-5 py-3 border-b border-mborder">
            <button onclick="backToHome()" title="Back to ${esc(proj.name)}" class="p-1 -ml-1 rounded hover:bg-msurface text-mtext3 hover:text-mtext flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold text-mtext truncate">${esc(th.title)}</div>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[9px] font-mono uppercase tracking-wide text-chip-blue bg-chip-blue-soft rounded px-1.5 py-0.5">${esc(th.skill)}</span>
                <button onclick="backToHome()" class="text-[11px] text-mtext3 hover:text-maccent">in ${esc(proj.name)}</button>
              </div>
            </div>
            <button onclick="openContextPanel('overview','${proj.id}')" class="text-xs px-2.5 py-1.5 rounded-md bg-msurface text-mtext border border-mborder hover:bg-mraised inline-flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Context
            </button>
            <button id="pause-btn" onclick="togglePause()" class="text-xs px-2.5 py-1.5 rounded-md bg-msurface text-mtext2 border border-mborder hover:bg-mraised">${th.paused ? 'Resume Agent' : 'Pause Agent'}</button>
            <button onclick="showSharedToast('Thread archived.')" class="text-xs px-2.5 py-1.5 rounded-md bg-msurface text-mtext3 border border-mborder hover:bg-mraised">Archive</button>
          </div>
          <div id="pause-banner" class="${th.paused ? '' : 'hidden'} px-5 py-2 bg-mambersoft border-b border-mamber/30 text-[11px] text-mamber">
            Agent paused on this thread — manual mode. The AI will not iterate; the advisor handles remaining work.
          </div>
        </div>`;
    }

    function newThreadEmptyState(proj) {
      return `
        <div class="max-w-[460px] mx-auto text-center mt-8 mb-2">
          <div class="w-10 h-10 rounded-lg bg-maccentl text-maccent flex items-center justify-center mx-auto mb-3">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          </div>
          <div class="text-sm font-semibold text-mtext">New hotel-search thread</div>
          <p class="text-xs text-mtext3 leading-relaxed mt-1.5">
            ${esc(proj.name)}'s context is loaded — trip facts, ClientFacts and org insights.
            Type the advisor's ask below and the agent returns grounded recommendations.
            Open <span class="text-mtext2">Context</span> any time to see what it knows.
          </p>
        </div>`;
    }

    function renderThread() {
      const th = AgentData.thread(curThread);
      const center = document.getElementById('center');
      if (!th) { center.innerHTML = ''; return; }
      const proj = AgentData.project(th.project);
      const msgs = AgentData.messages(curThread);
      const isNewEmpty = th.isNew && !msgs.some(m => m.role === 'advisor');

      center.innerHTML = `
        ${threadHeaderHtml(th, proj)}
        <div id="thread-messages" class="flex-1 overflow-y-auto" style="padding:18px 22px;">
          ${msgs.map(renderMessage).join('')}
          ${isNewEmpty ? newThreadEmptyState(proj) : ''}
        </div>
        <div class="flex-shrink-0 px-4 py-3 border-t border-mborder">
          <div class="flex items-center gap-2 bg-mbg border border-mborder rounded-lg px-3 py-2">
            <input id="composer-input" type="text" placeholder="Message the agent…" class="flex-1 bg-transparent text-sm text-mtext2 placeholder-mtext3 outline-none">
            <button id="composer-send" class="px-3 py-1 rounded-md bg-maccent text-xs text-white font-medium hover:bg-maccenth">Send</button>
          </div>
        </div>`;

      document.getElementById('thread-messages').scrollTop = 0;
      const ci = document.getElementById('composer-input');
      const cs = document.getElementById('composer-send');
      if (cs) cs.addEventListener('click', onComposerSend);
      if (ci) ci.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); onComposerSend(); } });
      if (isNewEmpty && ci) ci.focus();
    }

    function onComposerSend() {
      const th = AgentData.thread(curThread);
      const input = document.getElementById('composer-input');
      if (!th || !input) return;
      const text = (input.value || '').trim();
      if (!text) return;
      if (th.isNew) { input.value = ''; sendToThread(curThread, text); }
      else showSharedToast('Composer is a mock — this is a finished example thread.');
    }

    function togglePause() {
      const th = AgentData.thread(curThread); if (!th) return;
      th.paused = !th.paused;
      const b = document.getElementById('pause-banner');
      const btn = document.getElementById('pause-btn');
      if (b) b.classList.toggle('hidden', !th.paused);
      if (btn) btn.textContent = th.paused ? 'Resume Agent' : 'Pause Agent';
    }

    function scrollMessagesToBottom() {
      const m = document.getElementById('thread-messages');
      if (m) m.scrollTop = m.scrollHeight;
    }

    function renderRec(rid, msgFindings) {
      const r = AGENT_RECS[rid];
      const added = rid === 'rec-aman';
      const f = msgFindings.map(id => AGENT_FINDINGS[id]).find(x => x.target === rid);
      return `<div class="a-rec ${added ? 'added' : ''}">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-mtext">${r.name}</span>
              ${r.lead ? '<span class="text-[9px] font-mono text-maccent bg-maccentl rounded px-1.5 py-0.5">NAMED BY ADVISOR</span>' : ''}
            </div>
            <div class="text-[11px] text-mtext3 mt-0.5">${r.room} · ${r.area}</div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="text-sm font-semibold text-mtext">${r.rate}</div>
            <div class="text-[10px] text-mtext3">${r.total}</div>
          </div>
        </div>
        <p class="text-xs text-mtext2 leading-relaxed mt-2">${r.why}</p>
        <div class="flex items-center gap-2 mt-2.5 flex-wrap">
          <span class="src-chip" onclick="toggleHidden('src-${rid}')">◈ ${r.source.label}</span>
          ${f ? `<span class="hf-chip hf-factual" onclick="toggleHidden('fd-${f.id}')"><span class="d"></span>${f.helper}: ${f.summary}</span>` : ''}
          <span class="ml-auto">${added
            ? '<span class="text-[11px] text-msuccess font-medium">✓ Added to trip</span>'
            : `<button onclick="showSharedToast('${r.name} — added to the trip.')" class="text-[11px] px-2.5 py-1 rounded-md bg-msurface text-mtext border border-mborder hover:bg-maccent hover:text-white hover:border-maccent">Add to Trip</button>`}</span>
        </div>
        <div id="src-${rid}" class="hidden mt-2 text-[11px] font-mono text-chip-green bg-chip-green-soft border border-chip-green/20 rounded-md p-2">${r.source.detail}</div>
        ${f ? `<div id="fd-${f.id}" class="hidden mt-2 text-[11px] text-mamber bg-mambersoft border border-mamber/20 rounded-md p-2">${f.detail}</div>` : ''}
      </div>`;
    }

    function renderMessage(m) {
      if (m.kind === 'context')
        return `<div class="a-sys"><span class="w-1.5 h-1.5 rounded-full bg-mtext3 flex-shrink-0"></span><span>${m.body}</span></div>`;

      if (m.kind === 'check') {
        const f = AGENT_FINDINGS[m.findingId];
        return `<div class="a-sys"><span class="w-1.5 h-1.5 rounded-full bg-mtext3 flex-shrink-0"></span><span>${f.helper} ran before any recommendation was emitted (sub-agent, pre-emit)</span></div>
          <div class="mb-4">
            <span class="hf-chip hf-pass" onclick="toggleHidden('fd-${f.id}')"><span class="d"></span>${f.helper} ✓ ${f.summary}</span>
            <div id="fd-${f.id}" class="hidden mt-1.5 text-[11px] text-chip-green bg-chip-green-soft border border-chip-green/20 rounded-md p-2" style="max-width:520px;">${f.detail}</div>
          </div>`;
      }

      if (m.kind === 'event') {
        const inner = m.taskId
          ? `<a class="task-id-link underline underline-offset-2" href="task-board.html#task=${m.taskId}">${m.body}</a>`
          : m.body;
        return `<div class="mb-3.5" style="margin-left:40px;"><span class="a-event ${m.eventKind}">${m.eventKind === 'task' ? '◆' : '✦'} ${inner}</span></div>`;
      }

      // advisor / ai message rows
      const av = m.role === 'advisor' ? '<div class="a-av advisor">MC</div>' : '<div class="a-av ai">AI</div>';
      const name = m.role === 'advisor' ? 'Maya Chen · advisor' : 'Maestro AI';
      let body = `<div class="a-bubble">${m.body}</div>`;

      if (m.kind === 'recs') {
        const cards = m.recs.map(rid => renderRec(rid, m.findings || [])).join('');
        const setF = (m.findings || []).map(id => AGENT_FINDINGS[id]).filter(x => x.target === 'set' && x.severity !== 'pass');
        const setChips = setF.map(f => `
          <div class="mt-2">
            <span class="hf-chip hf-intent" onclick="toggleHidden('fd-${f.id}')"><span class="d"></span>${f.helper}: ${f.summary}</span>
            <div id="fd-${f.id}" class="hidden mt-1.5 text-[11px] text-chip-blue bg-chip-blue-soft border border-chip-blue/20 rounded-md p-2">${f.detail}</div>
          </div>`).join('');
        body += `<div class="mt-2 space-y-2">${cards}</div>${setChips}
          <div class="text-[10px] text-mtext3 mt-2">Findings are coalesced — one chip per finding kind. Click a chip for detail.</div>`;
      }
      if (m.kind === 'actions') {
        body += `<div class="flex flex-wrap gap-2 mt-2">
          ${m.actions.map(a => `<button onclick="showSharedToast('Finished thread — this action was already taken.')" class="text-xs px-3 py-1.5 rounded-md bg-msurface text-mtext2 border border-mborder hover:bg-mraised">${a}</button>`).join('')}
        </div>`;
      }
      if (m.kind === 'draft') {
        body += `<div class="mt-2 bg-mbg border border-mborder rounded-lg p-3">
          <div class="text-[10px] font-mono uppercase tracking-wider text-mtext3 mb-1.5">messaging task · draft to Aman Tokyo</div>
          <p class="text-xs text-mtext2 leading-relaxed">${m.draftText}</p>
          ${m.sent ? '<div class="mt-2.5 text-[11px] text-msuccess font-medium">✓ Sent to Aman Tokyo · messaging task closed</div>' : ''}
        </div>`;
      }
      return `<div class="a-msg ${m.role}">${av}<div style="flex:1;min-width:0;"><div class="a-name">${name}</div>${body}</div></div>`;
    }

    /* ---------- helpers ---------- */
    function toggleHidden(id) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden'); }

    function renderAll() {
      renderProjectList();
      renderCenter();
    }

    /* ---------- init ---------- */
    // Memory edits in the context panel re-render the Project Home so its counts stay live.
    if (window.onAgentContextMutated) {
      window.onAgentContextMutated(() => { if (!curThread) renderProjectHome(); });
    }
    // ⌘K — the PRD's signature gesture: start a new hotel-search thread on the current project.
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); startNewThread(''); }
    });

    parseHash();
    renderAll();
    window.addEventListener('hashchange', () => { parseHash(); renderAll(); });
  </script>

</body>
</html>
