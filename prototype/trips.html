<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trips — Conductor Task Mgmt Prototype</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700&family=DM+Serif+Display:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../maestro-theme.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mbg: 'rgb(var(--maestro-bg))',
            mcard: 'rgb(var(--maestro-card))',
            msurface: 'rgb(var(--maestro-surface))',
            mraised: 'rgb(var(--maestro-surface-raised))',
            mborder: 'rgb(var(--maestro-border))',
            mborderh: 'rgb(var(--maestro-border-hover))',
            mtext: 'rgb(var(--maestro-text-primary))',
            mtext2: 'rgb(var(--maestro-text-secondary))',
            mtext3: 'rgb(var(--maestro-text-tertiary))',
            maccent: 'rgb(var(--maestro-accent))',
            maccenth: 'rgb(var(--maestro-accent-hover))',
            maccentl: 'rgb(var(--maestro-accent-light))',
            msuccess: 'rgb(var(--maestro-success))',
            msuccessl: 'rgb(var(--maestro-success-light))',
            mdanger: 'rgb(var(--maestro-danger))',
            mdangerl: 'rgb(var(--maestro-danger-light))',
            mwarning: 'rgb(var(--maestro-warning))',
            mwarningl: 'rgb(var(--maestro-warning-light))',
            mamber: 'rgb(var(--maestro-amber))',
            mambersoft: 'rgb(var(--maestro-amber-soft))',
            minfo: 'rgb(var(--maestro-info))',
            minfol: 'rgb(var(--maestro-info-light))',
            'chip-green': 'rgb(var(--maestro-chip-green))',
            'chip-green-soft': 'rgb(var(--maestro-chip-green-soft))',
            'chip-orange': 'rgb(var(--maestro-chip-orange))',
            'chip-orange-soft': 'rgb(var(--maestro-chip-orange-soft))',
            'chip-blue': 'rgb(var(--maestro-chip-blue))',
            'chip-blue-soft': 'rgb(var(--maestro-chip-blue-soft))',
            'chip-teal': 'rgb(var(--maestro-chip-teal))',
            'chip-teal-soft': 'rgb(var(--maestro-chip-teal-soft))',
            'chip-purple': 'rgb(var(--maestro-chip-purple))',
            'chip-purple-soft': 'rgb(var(--maestro-chip-purple-soft))',
            'chip-pink': 'rgb(var(--maestro-chip-pink))',
            'chip-pink-soft': 'rgb(var(--maestro-chip-pink-soft))',
          },
          fontFamily: {
            sans: ['Commissioner', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['DM Serif Display', 'ui-serif', 'Georgia', 'serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>

  <script src="../theme.js"></script>
  <script src="task-data.js"></script>
  <script>window.CURRENT_APP_TAB = 'trips';</script>
  <script src="topnav.js"></script>
  <script src="task-drawer.js"></script>

  <style>
    body { background: rgb(var(--maestro-bg)); }

    .top-tab { padding: 0.625rem 0.875rem; font-size: 0.8125rem; color: rgb(var(--maestro-text-secondary)); cursor: pointer; transition: color .12s; border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 0.5rem; }
    .top-tab:hover { color: rgb(var(--maestro-text-primary)); }
    .top-tab.active { color: rgb(var(--maestro-text-primary)); border-bottom-color: rgb(var(--maestro-accent)); }

    .trip-tab { padding: 0.375rem 0.75rem; font-size: 0.8125rem; color: rgb(var(--maestro-text-secondary)); cursor: pointer; border-radius: 0.375rem; transition: all .12s; }
    .trip-tab.active { color: rgb(var(--maestro-text-primary)); background: rgb(var(--maestro-surface)); }
    .trip-tab:hover { color: rgb(var(--maestro-text-primary)); }

    .kanban-col { flex: 0 0 280px; max-width: 320px; background: rgb(var(--maestro-card)); border: 1px solid rgb(var(--maestro-border)); border-radius: 0.5rem; display: flex; flex-direction: column; max-height: calc(100vh - 280px); }
    .kanban-col-header { padding: 0.625rem 0.875rem; border-bottom: 1px solid rgb(var(--maestro-border)); background: color-mix(in srgb, rgb(var(--maestro-surface)) 40%, transparent); border-radius: 0.5rem 0.5rem 0 0; display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .kanban-col-body { padding: 0.625rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; flex: 1; }
    .trip-card { background: rgb(var(--maestro-bg)); border: 1px solid rgb(var(--maestro-border)); border-radius: 0.375rem; padding: 0.75rem; display: block; transition: all .12s; position: relative; }
    .trip-card:hover { border-color: rgb(var(--maestro-border-hover)); background: rgb(var(--maestro-card)); }
  </style>
</head>

<body class="text-mtext2 font-sans min-h-screen antialiased">

  <div id="topnav-root"></div>

  <div class="bg-mambersoft border-b border-mamber/30 px-4 py-1.5 text-[11px] text-mtext3 flex items-center gap-2">
    <svg class="w-3 h-3 text-mamber" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span>Prototype mock · orange dots on trip cards mark "AI suggestion pending for this trip" — same pattern as Chat list and Tasks Needs Review</span>
  </div>

  <main class="px-6 py-6">

    <!-- Stats row -->
    <div class="flex items-stretch gap-4 mb-6">
      <div class="bg-mcard border border-mborder rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-mtext3">Total Active</div>
        <div class="text-2xl font-mono text-mtext mt-1">10</div>
      </div>
      <div class="bg-mcard border border-mborder rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-mtext3">Needs Attention</div>
        <div class="text-2xl font-mono text-maccent mt-1" id="needs-attention-count">—</div>
      </div>
      <div class="bg-mcard border border-mborder rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-mtext3">Departing This Week</div>
        <div class="text-2xl font-mono text-mtext mt-1">3</div>
      </div>
      <div class="bg-mcard border border-mborder rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-mtext3">Avg. Days in Stage</div>
        <div class="text-2xl font-mono text-mtext mt-1">5.3</div>
      </div>
    </div>

    <!-- Tabs + filters row -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-1">
        <button class="trip-tab active">All Trips</button>
        <button class="trip-tab">My Trips</button>
        <button class="trip-tab">Attention Needed</button>
        <button class="trip-tab">VVIP</button>
      </div>
      <div class="flex items-center gap-2">
        <div class="relative">
          <input type="text" placeholder="Search by client, title, destination…" class="w-[320px] bg-msurface border border-mborder rounded-md pl-3 pr-3 py-1.5 text-xs text-mtext placeholder-mtext3 focus:outline-none focus:border-maccent" />
        </div>
        <button class="px-2.5 py-1.5 rounded-md bg-mcard border border-mborder text-xs text-mtext2 hover:border-mborderh">⚙ Filters</button>
      </div>
    </div>

    <!-- Kanban -->
    <div id="kanban" class="flex gap-3 overflow-x-auto pb-3">
      <!-- rendered by JS -->
    </div>

  </main>

  <script>
    // ─── Fictional trips (mocked for prototype) ───
    // Each trip has: id, name, advisor, dates, stage, tags, daysAgo, linkedTaskIds
    const TRIPS = [
      { id: 'trip-greer',     name: 'Greer family | Tokyo Apr 30',          advisor: 'Maya Chen',       dates: 'Apr 30 – May 6',   stage: 'Itinerary Review',   tags: ['VVIP', 'First class'], daysAgo: '12d',  linkedTasks: ['tsk-001', 'tsk-020', 'tsk-024'] },
      { id: 'trip-halverson', name: 'Halverson | Croatia draft',            advisor: 'Maya Chen',       dates: 'Aug 12 – Aug 22',  stage: 'Outline',            tags: ['Standard'],            daysAgo: '5d',   linkedTasks: ['tsk-002', 'tsk-021'] },
      { id: 'trip-whitman',   name: 'Whitman | Frankfurt May 16',           advisor: 'Tomás Kovac',     dates: 'May 16 – May 24',  stage: 'Booking In Progress', tags: ['VVIP', 'On trip', 'Disruption'], daysAgo: '2d', linkedTasks: ['tsk-003', 'tsk-013', 'tsk-022'] },
      { id: 'trip-castelli',  name: 'Castelli | Tokyo May 25',              advisor: 'Maya Chen',       dates: 'May 25 – Jun 2',   stage: 'Booking In Progress', tags: ['VVIP', 'Suite'],      daysAgo: '21d',  linkedTasks: ['tsk-004', 'tsk-009', 'tsk-010', 'tsk-012', 'tsk-016'] },
      { id: 'trip-patel',     name: 'Patel | Tuscany Jun 22',               advisor: 'Jordan Singh',    dates: 'Jun 22 – Jul 4',   stage: 'Outline',            tags: ['Standard', 'Villa', 'Dog'], daysAgo: '1h 42m', linkedTasks: ['tsk-005', 'tsk-019'] },
      { id: 'trip-bowman',    name: 'Bowman | Patagonia Aug',               advisor: 'Maya Chen',       dates: 'Aug 14 – Aug 28',  stage: 'Trip Identified',    tags: ['Standard', 'Payment overdue'], daysAgo: '8d', linkedTasks: ['tsk-007', 'tsk-014', 'tsk-023'] },
      { id: 'trip-park-halverson', name: 'Park-Halverson | Bali',           advisor: 'Maya Chen',       dates: 'May 14 – May 24',  stage: 'Booking Complete',   tags: ['VVIP', 'Honeymoon', 'On trip'], daysAgo: '1d', linkedTasks: ['tsk-008', 'tsk-015', 'tsk-017'] },
      { id: 'trip-aboud',     name: 'Aboud | London May 22',                advisor: 'Maya Chen',       dates: 'May 22 – May 26',  stage: 'Booking Complete',   tags: ['VVIP'],                daysAgo: '1 min', linkedTasks: [] },
      { id: 'trip-thompson',  name: 'Thompson | Maldives 2027',             advisor: 'Jordan Singh',    dates: '(date TBD)',       stage: 'Not Started',        tags: ['Standard'],            daysAgo: '3d',   linkedTasks: [] },
      { id: 'trip-zhang',     name: 'Zhang | Iceland Winter 2027',          advisor: 'Maya Chen',       dates: '(date TBD)',       stage: 'Not Started',        tags: ['Standard', 'Northern lights'], daysAgo: '7d', linkedTasks: [] },
    ];

    const STAGES = ['Not Started', 'Trip Identified', 'Outline', 'Itinerary Review', 'Booking In Progress', 'Booking Complete'];

    function tripPendingTasks(trip) {
      return trip.linkedTasks
        .map(id => TaskFilters.byId(id))
        .filter(t => t && t.approval_state === 'pending-review' && t.status !== 'dismissed');
    }

    function renderKanban() {
      const cols = STAGES.map(stage => {
        const trips = TRIPS.filter(t => t.stage === stage);
        const pending = trips.reduce((sum, t) => sum + tripPendingTasks(t).length, 0);
        return { stage, trips, pending };
      });
      const root = document.getElementById('kanban');
      root.innerHTML = cols.map(col => `
        <div class="kanban-col">
          <div class="kanban-col-header">
            ${col.pending > 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-maccent flex-shrink-0"></span>' : '<span class="w-1.5 h-1.5 rounded-full bg-mborder flex-shrink-0"></span>'}
            <div class="text-[11px] font-semibold text-mtext flex-1">${col.stage}</div>
            <span class="text-[10px] font-mono text-mtext3">${col.trips.length}</span>
            ${col.pending > 0 ? `<span class="text-[10px] font-mono text-maccent bg-maccentl border border-maccent/40 rounded px-1" title="${col.pending} pending AI suggestion${col.pending === 1 ? '' : 's'} across trips in this column">${col.pending}</span>` : ''}
          </div>
          <div class="kanban-col-body">
            ${col.trips.length === 0 ? '<div class="text-[11px] text-mtext3 text-center py-4 italic">empty</div>' : col.trips.map(t => {
              const pendingCount = tripPendingTasks(t).length;
              return `
                <a href="trip-detail.html#id=${t.id}" class="trip-card group">
                  ${pendingCount > 0 ? `<span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-maccent" title="${pendingCount} AI suggestion${pendingCount === 1 ? '' : 's'} pending for this trip"></span>` : ''}
                  <div class="text-sm font-medium text-mtext leading-snug pr-4 group-hover:text-maccent transition-colors">${t.name}</div>
                  <div class="text-[11px] text-mtext3 mt-1.5">${t.advisor}</div>
                  <div class="text-[11px] text-mtext2 font-mono mt-0.5">${t.dates} <span class="text-mtext3">· ${t.daysAgo}</span></div>
                  <div class="flex items-center gap-1 mt-2 flex-wrap">
                    ${t.tags.map(tag => {
                      const isWarn = /disruption|overdue|attention/i.test(tag);
                      const isVVIP = /vvip/i.test(tag);
                      const cls = isWarn ? 'bg-mdangerl text-mdanger border-mdanger/30' : isVVIP ? 'bg-maccentl text-maccent border-maccent/30' : 'bg-msurface text-mtext2 border-mborder';
                      return `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] border ${cls}">${tag}</span>`;
                    }).join('')}
                  </div>
                  ${pendingCount > 0 ? `<div class="text-[10px] text-maccent mt-2 inline-flex items-center gap-1">${pendingCount} AI suggestion${pendingCount === 1 ? '' : 's'} pending</div>` : ''}
                </a>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function rerenderAll() {
      renderKanban();
      const totalPending = TRIPS.reduce((s, t) => s + tripPendingTasks(t).length, 0);
      document.getElementById('needs-attention-count').textContent = totalPending;
      if (window.TopNav) window.TopNav.init(); // refresh nav badges
    }
    document.addEventListener('DOMContentLoaded', () => {
      rerenderAll();
      if (window.onTaskMutated) window.onTaskMutated(rerenderAll);
    });
  </script>

</body>
</html>
