<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trips — Conductor Task Mgmt Prototype</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="../theme.js"></script>
  <script src="task-data.js"></script>
  <script>window.CURRENT_APP_TAB = 'trips';</script>
  <script src="topnav.js"></script>
  <script src="task-drawer.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    body { background: #020617; }

    .top-tab { padding: 0.625rem 0.875rem; font-size: 0.8125rem; color: rgb(148 163 184); cursor: pointer; transition: color .12s; border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 0.5rem; }
    .top-tab:hover { color: rgb(241 245 249); }
    .top-tab.active { color: rgb(241 245 249); border-bottom-color: rgb(255 94 50); }

    .trip-tab { padding: 0.375rem 0.75rem; font-size: 0.8125rem; color: rgb(148 163 184); cursor: pointer; border-radius: 0.375rem; transition: all .12s; }
    .trip-tab.active { color: rgb(241 245 249); background: rgb(30 41 59); }
    .trip-tab:hover { color: rgb(241 245 249); }

    .kanban-col { flex: 0 0 280px; max-width: 320px; background: rgb(15 23 42); border: 1px solid rgb(30 41 59); border-radius: 0.5rem; display: flex; flex-direction: column; max-height: calc(100vh - 280px); }
    .kanban-col-header { padding: 0.625rem 0.875rem; border-bottom: 1px solid rgb(30 41 59); background: rgba(30, 41, 59, 0.4); border-radius: 0.5rem 0.5rem 0 0; display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .kanban-col-body { padding: 0.625rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; flex: 1; }
    .trip-card { background: rgb(2 6 23); border: 1px solid rgb(30 41 59); border-radius: 0.375rem; padding: 0.75rem; display: block; transition: all .12s; position: relative; }
    .trip-card:hover { border-color: rgb(51 65 85); background: rgb(15 23 42); }
  </style>
</head>

<body class="text-slate-300 font-sans min-h-screen antialiased">

  <div id="topnav-root"></div>

  <div class="bg-amber-500/10 border-b border-amber-500/30 px-4 py-1.5 text-[11px] text-slate-400 flex items-center gap-2">
    <svg class="w-3 h-3 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span>Prototype mock · orange dots on trip cards mark "AI suggestion pending for this trip" — same pattern as Chat list and Tasks Needs Review</span>
  </div>

  <main class="px-6 py-6">

    <!-- Stats row -->
    <div class="flex items-stretch gap-4 mb-6">
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Total Active</div>
        <div class="text-2xl font-mono text-slate-100 mt-1">10</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Needs Attention</div>
        <div class="text-2xl font-mono text-orange-300 mt-1" id="needs-attention-count">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Departing This Week</div>
        <div class="text-2xl font-mono text-slate-100 mt-1">3</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Avg. Days in Stage</div>
        <div class="text-2xl font-mono text-slate-100 mt-1">5.3</div>
      </div>
    </div>

    <!-- Tabs + filters row -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-1">
        <button class="trip-tab active">All Trips</button>
        <button class="trip-tab">My Trips</button>
        <button class="trip-tab">Attention Needed</button>
        <button class="trip-tab">VVIP</button>
      </div>
      <div class="flex items-center gap-2">
        <div class="relative">
          <input type="text" placeholder="Search by client, title, destination…" class="w-[320px] bg-slate-900 border border-slate-800 rounded-md pl-3 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500" />
        </div>
        <button class="px-2.5 py-1.5 rounded-md bg-slate-900 border border-slate-800 text-xs text-slate-300 hover:border-slate-700">⚙ Filters</button>
      </div>
    </div>

    <!-- Kanban -->
    <div id="kanban" class="flex gap-3 overflow-x-auto pb-3">
      <!-- rendered by JS -->
    </div>

  </main>

  <script>
    // ─── Fictional trips (mocked for prototype) ───
    // Each trip has: id, name, advisor, dates, stage, tags, daysAgo, linkedTaskIds
    const TRIPS = [
      { id: 'trip-greer',     name: 'Greer family | Tokyo Apr 30',          advisor: 'Maya Chen',       dates: 'Apr 30 – May 6',   stage: 'Itinerary Review',   tags: ['VVIP', 'First class'], daysAgo: '12d',  linkedTasks: ['tsk-001', 'tsk-020', 'tsk-024'] },
      { id: 'trip-halverson', name: 'Halverson | Croatia draft',            advisor: 'Maya Chen',       dates: 'Aug 12 – Aug 22',  stage: 'Outline',            tags: ['Standard'],            daysAgo: '5d',   linkedTasks: ['tsk-002', 'tsk-021'] },
      { id: 'trip-whitman',   name: 'Whitman | Frankfurt May 16',           advisor: 'Tomás Kovac',     dates: 'May 16 – May 24',  stage: 'Booking In Progress', tags: ['VVIP', 'On trip', 'Disruption'], daysAgo: '2d', linkedTasks: ['tsk-003', 'tsk-013', 'tsk-022'] },
      { id: 'trip-castelli',  name: 'Castelli | Tokyo May 25',              advisor: 'Maya Chen',       dates: 'May 25 – Jun 2',   stage: 'Booking In Progress', tags: ['VVIP', 'Suite'],      daysAgo: '21d',  linkedTasks: ['tsk-004', 'tsk-009', 'tsk-010', 'tsk-012', 'tsk-016'] },
      { id: 'trip-patel',     name: 'Patel | Tuscany Jun 22',               advisor: 'Jordan Singh',    dates: 'Jun 22 – Jul 4',   stage: 'Outline',            tags: ['Standard', 'Villa', 'Dog'], daysAgo: '1h 42m', linkedTasks: ['tsk-005', 'tsk-019'] },
      { id: 'trip-bowman',    name: 'Bowman | Patagonia Aug',               advisor: 'Maya Chen',       dates: 'Aug 14 – Aug 28',  stage: 'Trip Identified',    tags: ['Standard', 'Payment overdue'], daysAgo: '8d', linkedTasks: ['tsk-007', 'tsk-014', 'tsk-023'] },
      { id: 'trip-park-halverson', name: 'Park-Halverson | Bali',           advisor: 'Maya Chen',       dates: 'May 14 – May 24',  stage: 'Booking Complete',   tags: ['VVIP', 'Honeymoon', 'On trip'], daysAgo: '1d', linkedTasks: ['tsk-008', 'tsk-015', 'tsk-017'] },
      { id: 'trip-aboud',     name: 'Aboud | London May 22',                advisor: 'Maya Chen',       dates: 'May 22 – May 26',  stage: 'Booking Complete',   tags: ['VVIP'],                daysAgo: '1 min', linkedTasks: [] },
      { id: 'trip-thompson',  name: 'Thompson | Maldives 2027',             advisor: 'Jordan Singh',    dates: '(date TBD)',       stage: 'Not Started',        tags: ['Standard'],            daysAgo: '3d',   linkedTasks: [] },
      { id: 'trip-zhang',     name: 'Zhang | Iceland Winter 2027',          advisor: 'Maya Chen',       dates: '(date TBD)',       stage: 'Not Started',        tags: ['Standard', 'Northern lights'], daysAgo: '7d', linkedTasks: [] },
    ];

    const STAGES = ['Not Started', 'Trip Identified', 'Outline', 'Itinerary Review', 'Booking In Progress', 'Booking Complete'];

    function tripPendingTasks(trip) {
      return trip.linkedTasks
        .map(id => TaskFilters.byId(id))
        .filter(t => t && t.approval_state === 'pending-review' && t.status !== 'dismissed');
    }

    function renderKanban() {
      const cols = STAGES.map(stage => {
        const trips = TRIPS.filter(t => t.stage === stage);
        const pending = trips.reduce((sum, t) => sum + tripPendingTasks(t).length, 0);
        return { stage, trips, pending };
      });
      const root = document.getElementById('kanban');
      root.innerHTML = cols.map(col => `
        <div class="kanban-col">
          <div class="kanban-col-header">
            ${col.pending > 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-orange-500 flex-shrink-0"></span>' : '<span class="w-1.5 h-1.5 rounded-full bg-slate-600 flex-shrink-0"></span>'}
            <div class="text-[11px] font-semibold text-slate-200 flex-1">${col.stage}</div>
            <span class="text-[10px] font-mono text-slate-500">${col.trips.length}</span>
            ${col.pending > 0 ? `<span class="text-[10px] font-mono text-orange-300 bg-orange-500/15 border border-orange-500/40 rounded px-1" title="${col.pending} pending AI suggestion${col.pending === 1 ? '' : 's'} across trips in this column">${col.pending}</span>` : ''}
          </div>
          <div class="kanban-col-body">
            ${col.trips.length === 0 ? '<div class="text-[11px] text-slate-600 text-center py-4 italic">empty</div>' : col.trips.map(t => {
              const pendingCount = tripPendingTasks(t).length;
              return `
                <a href="trip-detail.html#id=${t.id}" class="trip-card group">
                  ${pendingCount > 0 ? `<span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-orange-500" title="${pendingCount} AI suggestion${pendingCount === 1 ? '' : 's'} pending for this trip"></span>` : ''}
                  <div class="text-sm font-medium text-slate-100 leading-snug pr-4 group-hover:text-orange-300 transition-colors">${t.name}</div>
                  <div class="text-[11px] text-slate-500 mt-1.5">${t.advisor}</div>
                  <div class="text-[11px] text-slate-400 font-mono mt-0.5">${t.dates} <span class="text-slate-600">· ${t.daysAgo}</span></div>
                  <div class="flex items-center gap-1 mt-2 flex-wrap">
                    ${t.tags.map(tag => {
                      const isWarn = /disruption|overdue|attention/i.test(tag);
                      const isVVIP = /vvip/i.test(tag);
                      const cls = isWarn ? 'bg-red-500/10 text-red-400 border-red-500/30' : isVVIP ? 'bg-orange-500/10 text-orange-300 border-orange-500/30' : 'bg-slate-800 text-slate-400 border-slate-700';
                      return `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] border ${cls}">${tag}</span>`;
                    }).join('')}
                  </div>
                  ${pendingCount > 0 ? `<div class="text-[10px] text-orange-400 mt-2 inline-flex items-center gap-1">${pendingCount} AI suggestion${pendingCount === 1 ? '' : 's'} pending</div>` : ''}
                </a>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function rerenderAll() {
      renderKanban();
      const totalPending = TRIPS.reduce((s, t) => s + tripPendingTasks(t).length, 0);
      document.getElementById('needs-attention-count').textContent = totalPending;
      if (window.TopNav) window.TopNav.init(); // refresh nav badges
    }
    document.addEventListener('DOMContentLoaded', () => {
      rerenderAll();
      if (window.onTaskMutated) window.onTaskMutated(rerenderAll);
    });
  </script>

</body>
</html>
